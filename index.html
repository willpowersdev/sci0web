<!doctype html>
<meta charset="utf-8">
<title>SCI0 Explorer</title>
<style>
  :root{--bg:#14141a;--panel:#1c1c24;--line:#31313d;--fg:#d6d6e0;--dim:#8a8a9a;--accent:#7fd1ff}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);
       display:grid;grid-template-columns:300px 1fr;height:100vh}
  #side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header{padding:12px;border-bottom:1px solid var(--line)}
  h1{font-size:14px;margin:0 0 8px}
  #tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
  .tab{padding:3px 9px;border:1px solid var(--line);border-radius:4px;cursor:pointer;color:var(--dim)}
  .tab.on{background:var(--accent);color:#08080c;border-color:var(--accent)}
  #list{overflow:auto;flex:1;min-height:0}
  .row{padding:4px 12px;cursor:pointer;white-space:nowrap}
  .row:hover{background:#25252f}
  .row.on{background:var(--accent);color:#08080c}
  #main{display:flex;flex-direction:column;min-width:0;min-height:0}
  #bar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* Export sits apart from the view toggles so it cannot read as one. */
  .exp{border-color:var(--accent);color:var(--accent)}
  .exp:hover{background:var(--accent);color:#08080c}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
  #stage{flex:1;display:grid;place-items:center;overflow:auto;padding:16px;min-height:0}
  /* Text viewers want the whole width, top-aligned, not centred like a canvas. */
  #stage.text{place-items:start stretch}
  #text{margin:0;font:inherit;white-space:pre;tab-size:4}
  #text .k{color:var(--accent)}
  #text .c{color:var(--dim)}
  #text .s{color:#c5e8a0}
  #text .h{color:#e8c07a}
  #text b{color:#fff;font-weight:600}
  canvas{image-rendering:pixelated;background:#000;box-shadow:0 0 0 1px var(--line)}
  button,select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);
                border-radius:4px;padding:3px 8px}
  button:hover{border-color:var(--accent)}
  .dim{color:var(--dim)}
  input[type=file]{font:inherit;color:var(--dim);width:100%}
  /* Playing takes the whole window: the browsing chrome would only be
     something to click on by accident. */
  body.play{grid-template-columns:1fr}
  body.play #side,body.play #bar{display:none}
  body.play #stage{padding:0;background:#000;place-items:center}
  /* Nothing around the picture while playing: the game's own border is
     part of the art, and a line drawn outside it reads as a second one. */
  /* While playing, the pointer on screen is the game's own, drawn into
     the frame -- so the browser's must not be there as well. */
  body.play canvas{box-shadow:none;cursor:none}
  #play{width:100%;margin-top:8px;padding:5px;border:1px solid var(--accent);
        color:var(--accent);background:var(--panel);border-radius:4px;cursor:pointer}
  #play:hover{background:var(--accent);color:#08080c}
  #play[disabled]{opacity:.4;cursor:default;border-color:var(--line);color:var(--dim)}
  /* One row, laid out rather than each control placed by hand: a select
     is as wide as its longest option, so a fixed offset for its
     neighbour only holds until the wording changes. */
  #playbar{position:fixed;top:8px;right:10px;z-index:5;display:flex;gap:8px;align-items:center}
  #playbar > *{opacity:.25}
  #playbar > *:hover,#playbar > *:focus{opacity:1}
  #hud{position:fixed;bottom:6px;left:10px;z-index:5;color:var(--dim);
       font:11px ui-monospace,Menlo,monospace;opacity:.5}
  /* Focused but invisible: it exists to catch typing and dictation. */
  #dictate{position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;
           border:0;padding:0;z-index:1}

  #mic.on{opacity:1;border-color:var(--accent);color:var(--accent)}
</style>
<div id="side">
  <header>
    <h1>SCI0 Explorer</h1>
    <select id="games" hidden title="Select a game">
      <option value="">Select a Game</option>
    </select>
    <div class="dim" id="gameinfo" style="margin-top:8px">loading…</div>
    <button id="play" disabled>▶ Play this game</button>
  </header>
  <div id="tabs"></div>
  <div id="list"></div>
</div>
<div id="main">
  <!-- #title is permanent; #controls is the part each viewer rebuilds. -->
  <div id="bar"><span class="dim" id="title">nothing loaded</span><span id="controls"></span></div>
  <div id="stage"><canvas id="cv" width="960" height="684"></canvas><pre id="text" hidden></pre></div>
</div>
<!--
  Dictation needs somewhere to dictate into.  macOS inserts recognised
  text into whatever editable element has focus, and a canvas is not one,
  so playing keeps this input focused and invisible over the picture; the
  characters it receives are forwarded to the game as keystrokes.
-->
<input id="dictate" hidden autocomplete="off" autocapitalize="off" spellcheck="false">
<div id="playbar">
  <button id="dither" hidden title="how the EGA's dither pairs are shown: blended into one colour, or alternating as the hardware did">▦ blended</button>
  <select id="speed" hidden title="game cycles per second; the period rate is 20">
    <option value="10">10 cps</option>
    <option value="15">15 cps</option>
    <option value="20" selected>20 cps</option>
    <option value="30">30 cps</option>
    <option value="60">60 cps</option>
    <option value="600">skip intro</option>
  </select>
  <button id="crt" hidden title="show the picture on a simulated CRT: scanlines, phosphor mask, halation and curvature">📺 CRT</button>
  <select id="output" hidden title="where the music is played: the game's own AdLib chip, or a General MIDI synthesiser">
    <option value="adlib" selected>AdLib</option>
  </select>
  <button id="mic" hidden title="put the cursor in the dictation field, then press fn twice">🎤 dictation</button>
  <button id="quit" hidden>exit</button>
</div>
<div id="hud" hidden></div>
<div style="display:none">
</div>
<!--
  The bundle is served through a CDN that caches it for hours, so a
  deploy the page asks for by name is a deploy nobody sees.  The
  query is the build it wants; the page itself is never cached.
-->
<script type="module" src="./dist/app.js?v=f07232be"></script>
